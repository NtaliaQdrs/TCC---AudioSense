<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>customizar_audiosense</title>

    <link rel="stylesheet" href="../estilos/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="containercust">
        <div class="saudacao">
            <!-- Logo da AudioSense -->
            <img src="../logos/audiosense-login.png" alt="AudioSense Logo" class="logo">
            <h1> Customizar perfil</h1>
        </div>

        <div class="image-card">
            <img src="usuario.png" alt="Foto do usuário">
            <button class="btn-foto">Escolha uma foto</button>
        </div>

        <div class="cad">
            <form>
                <div class="input-group">
                    <i class="bi bi-envelope-fill"></i>
                    <div class="input-content">
                        <label>Nome de usuário</label>
                        <input type="text" placeholder="Usuário123" required>
                    </div>
                </div>

                <div class="input-group">
    <i class="bi bi-envelope-fill"></i>
    <div class="input-content">
        <label>Biografia/Descrição</label>
        <textarea 
        placeholder="Digite aqui uma pequena descrição do seu perfil ou uma biografia..."
        rows="5" 
        required></textarea>
    </div>
</div>

    <div class="btn-group">
    <button type="submit" class="btn-submitcust">Salvar</button>
    <button type="button" class="btn-cancel">Cancelar</button>
    </div>

        <p class="footer-text">Já possui uma conta? <a href="login.html">Entre</a></p>
        </form>

    </div>
    <script src="../scripts/cadastroDocente.js"> </script>

</body>

</html>
