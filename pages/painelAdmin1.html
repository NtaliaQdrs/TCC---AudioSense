<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paineladmin_audiosense</title>

    <link rel="stylesheet" href="../estilos/painel.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <script>
            // Verificar se é admin
            async function verificarAcesso() {
                const token = localStorage.getItem('token');

                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }

                try {
                    const response = await fetch('http://localhost:3000/api/admin/verificar-admin', {

                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    const data = await response.json();

                    if (data.isAdmin) {
                        // Se for admin, redireciona para painel admin 2
                        window.location.href = 'painelAdmin2.html';
                    }
                    // Se não for admin, deixa a página carregar normalmente
                } catch (error) {
                    console.error('Erro ao verificar acesso:', error);
                }
            }

            // Chamar quando a página carregar
            window.addEventListener('load', verificarAcesso);
        </script>
     
    <div class="containerad">
        <div class="saudacao">
            <h1>
                <i class="bi bi-person-fill-lock"></i>
                Solicitar acesso de Administrador
            </h1>
        </div>
        <h1> O acesso de administrador fornece controle total sobre a gestão de usuários, conteúdo, configurações do
            sistema e relatórios. Esta função é reservada para pessoas autorizadas e requer aprovação.</h1>

        <button type="submit" class="btn-submitcust">solicitação pendente</button>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="cad">
            <form>
                <div class="input-group">
                    <div class="input-content">
                        <label>Justificativa</label>
                        <textarea
                            placeholder="Por favor, explique por que você precisa de acesso administrativo e quais funções você desempenhará. Seja específico e detalhado."
                            rows="5" required></textarea>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-content">
                        <label>Documento de comprovação</label>
                        <input type="file">
                    </div>
                </div>

                <button type="button" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-submitcust"> Enviar solicitação </button>
            </form>

        </div>

        <script src="../scripts/index.js"></script>
        


</body>

</html>
